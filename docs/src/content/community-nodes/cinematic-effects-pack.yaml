title: Cinematic Effects Pack
author: JPPhoto
repo: https://github.com/JPPhoto/cinematic-effects-pack
summary: Anamorphic lens effects, depth-based bokeh, tone curves, color cast correction and film grain.
description: >-
  Replaces Anamorphic Tools (`anamorphic-tools`), Curves (`curves-node`), Film Grain (`film-grain-node`) and
  Color Correction Nodes (`color-correction-nodes`). Remove the old packs from your `nodes` folder before installing
  this pack; loading them together may register duplicate invocation IDs.
categories: [image-effects]
