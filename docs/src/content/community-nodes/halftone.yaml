title: Halftone
author: JPPhoto
repo: https://github.com/JPPhoto/halftone-node
summary: Grayscale and CMYK halftoning, for a magazine or newspaper print look.
description: >-
  Both nodes let you set the angles and the halftone dot spacing.
categories: [image-effects]
nodes:
  - name: Halftone
    description: Converts the image to grayscale, then halftones it.
  - name: CMYK Halftone
    description: Converts the image to CMYK and halftones each channel.
