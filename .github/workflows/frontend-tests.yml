# Runs frontend tests.
#
# Checks for changes to frontend files before running the tests.
# If always_run is true, always runs the tests.

name: 'frontend tests'

on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - 'ready_for_review'
      - 'opened'
      - 'synchronize'
  merge_group:
  workflow_dispatch:
    inputs:
      always_run:
        description: 'Always run the tests'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      always_run:
        description: 'Always run the tests'
        required: true
        type: boolean
        default: true

# One run per pull request: a new push cancels the superseded run. The PR number is used rather
# than the head branch, which two forks can share. Pushes to main and merge groups fall back to
# the run id and never cancel each other. The group names the workflow literally
# because `github.workflow` is the caller's name inside a reusable workflow, and release.yml calls
# several of these at once.
permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend-webv2-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30 # Completion reached 19 minutes; allow 3-engine smoke and cold exact-base measurements.
    defaults:
      run:
        working-directory: invokeai/frontend/webv2
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1

      - name: check for changed webv2 files
        if: ${{ inputs.always_run != true }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files_yaml: |
            webv2:
              - '.github/workflows/frontend-tests.yml'
              - '.github/workflows/frontend-checks.yml'
              - '.nvmrc'
              - '.github/actions/install-frontend-deps/**'
              - 'invokeai/frontend/webv2/**'

      - name: install dependencies
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        uses: ./.github/actions/install-frontend-deps
        with:
          working-directory: invokeai/frontend/webv2

      - name: install smoke browsers
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        run: 'pnpm exec playwright install --with-deps chromium firefox webkit'
        shell: bash

      # A pull request into main, or a merge group, is compared with the base branch's
      # own measurements at the exact base commit. A skipped or failed main run may leave no cache
      # entry; measure that base in isolation rather than compare with an older main's smaller payload.
      # Other events compare against the committed baseline. Candidate gates remain strict in every case.
      - name: restore performance reference
        id: perf-ref
        if: ${{ (steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true) && ((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')) }}
        uses: actions/cache/restore@v5
        with:
          path: invokeai/frontend/webv2/artifacts/perf-reference
          key: webv2-perf-reference-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

      - name: check out missing performance base
        id: perf-base
        if: ${{ steps.perf-ref.outcome == 'success' && steps.perf-ref.outputs.cache-hit != 'true' }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .perf-base
          persist-credentials: false

      - name: install performance base dependencies
        if: ${{ steps.perf-base.outcome == 'success' }}
        uses: ./.github/actions/install-frontend-deps
        with:
          working-directory: .perf-base/invokeai/frontend/webv2
          node-version-file: .perf-base/.nvmrc

      - name: measure missing performance base
        if: ${{ steps.perf-base.outcome == 'success' }}
        working-directory: .perf-base/invokeai/frontend/webv2
        env:
          WEBV2_PERF_REFERENCE_DIR: ''
          WEBV2_PERF_REFERENCE_LABEL: ''
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite build
          rm -f artifacts/architecture-performance/build-reference.json artifacts/architecture-performance/browser-reference.json
          # Measurements are written before budget checks. Both must exist even if the base has outgrown its budgets.
          node --experimental-strip-types scripts/check-architecture-performance.mjs || echo "::notice::Base build check failed; validating its measurements below."
          node scripts/measure-architecture-performance.mjs || echo "::notice::Base browser check failed; validating its measurements below."
          node --input-type=module <<'NODE'
          import { copyFile, mkdir, readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const candidate = resolve(process.env.GITHUB_WORKSPACE, 'invokeai/frontend/webv2');
          const { applyBuildReference, applyBrowserReference, loadPerformanceReference, BUILD_METRIC_KEYS, BROWSER_RESOURCE_METRIC_KEYS } =
            await import(pathToFileURL(resolve(candidate, 'scripts/performance-budgets.mjs')));
          for (const [kind, metricKeys, baselineFile] of [
            ['build', BUILD_METRIC_KEYS, 'architecture-baseline.json'],
            ['browser', BROWSER_RESOURCE_METRIC_KEYS, 'browser-baseline.json'],
          ]) {
            const fileName = `${kind}-reference.json`;
            const { reference, reason } = await loadPerformanceReference({
              directory: 'artifacts/architecture-performance', fileName, kind, metricKeys, root: process.cwd(),
            });
            if (reason) throw new Error(`Invalid exact-base ${kind} reference: ${reason}`);
            const baseline = JSON.parse(await readFile(`performance/${baselineFile}`, 'utf8'));
            const applied = kind === 'build' ? applyBuildReference(baseline.build, reference) : applyBrowserReference(baseline.routes, reference);
            if (applied.uncovered.length) throw new Error(`Incomplete exact-base ${kind} reference: ${applied.uncovered.join(', ')}`);
          }
          const destination = resolve(candidate, 'artifacts/perf-reference');
          await mkdir(destination, { recursive: true });
          for (const kind of ['build', 'browser']) {
            await copyFile(`artifacts/architecture-performance/${kind}-reference.json`, resolve(destination, `${kind}-reference.json`));
          }
          NODE
        shell: bash

      - name: restore candidate Node version
        if: ${{ steps.perf-base.outcome == 'success' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: release completion gates
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        run: 'pnpm check:release:tests'
        shell: bash
        env:
          WEBV2_PERF_REFERENCE_DIR: ${{ steps.perf-ref.outcome == 'success' && 'artifacts/perf-reference' || '' }}
          WEBV2_PERF_REFERENCE_LABEL: ${{ steps.perf-ref.outcome == 'success' && format('webv2-perf-reference-{0}', github.event.pull_request.base.sha || github.event.merge_group.base_sha) || '' }}

      # Recorded even when the gate failed: a main that has outgrown the committed baseline is
      # still the right thing for a pull request to be compared with. A main job that ran the gate
      # but produced no reference (a failure before the browser stage) records nothing and says so;
      # one that left webv2 untouched has nothing to record. Pull requests based on either measure
      # that exact base instead.
      - name: stage performance reference
        id: perf-ref-stage
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true) }}
        env:
          REFERENCE_SHA: ${{ github.sha }}
        run: |
          if [ -f artifacts/architecture-performance/build-reference.json ] && [ -f artifacts/architecture-performance/browser-reference.json ]; then
            mkdir -p artifacts/perf-reference
            cp artifacts/architecture-performance/build-reference.json artifacts/architecture-performance/browser-reference.json artifacts/perf-reference/
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No performance reference recorded for $REFERENCE_SHA; pull requests based on it measure their exact base."
          fi
        shell: bash

      - name: save performance reference
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.perf-ref-stage.outputs.ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: invokeai/frontend/webv2/artifacts/perf-reference
          key: webv2-perf-reference-${{ github.sha }}

      - name: upload architecture review artifacts
        if: ${{ always() && (steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true) }}
        uses: actions/upload-artifact@v6
        with:
          name: webv2-architecture-review
          path: |
            invokeai/frontend/webv2/artifacts/architecture
            invokeai/frontend/webv2/artifacts/architecture-performance
            invokeai/frontend/webv2/artifacts/accessibility
            invokeai/frontend/webv2/artifacts/browser-smoke
          if-no-files-found: ignore
