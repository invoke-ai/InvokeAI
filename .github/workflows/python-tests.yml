# Runs python tests on a matrix of python versions and platforms.
#
# Checks for changes to python files before running the tests.
# If always_run is true, always runs the tests.
# A push to main skips each job that already ran its tests on the same commit in the merge queue.
#
# Windows ARM64 runs in shards, in jobs of its own, whenever the Python tests run. The
# `py3.12: windows-arm64` job is its single status, meant to be marked required by a maintainer.

name: 'python tests'

on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - 'ready_for_review'
      - 'opened'
      - 'synchronize'
  merge_group:
  workflow_dispatch:
    inputs:
      always_run:
        description: 'Always run the tests'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      always_run:
        description: 'Always run the tests'
        required: true
        type: boolean
        default: true

# One run per pull request: a new push cancels the superseded run. The PR number is used rather
# than the head branch, which two forks can share. Pushes to main and merge groups fall back to
# the run id and never cancel each other. The group names the workflow literally
# because `github.workflow` is the caller's name inside a reusable workflow, and release.yml calls
# several of these at once.
permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A push to main fast-forwards main to the commit the merge queue's group tested (squash merge queue), so the
  # `merge_group` run of this workflow for the same SHA has already run these jobs on the identical tree. The queue
  # merges as soon as the required jobs pass, while the non-required ones can still run, so this is decided per
  # job by name: a job is skipped only when its namesake concluded `success` and its own `run pytest` step
  # succeeded in a merge-group run of this SHA. The step check matters because an entry of a multi-entry group
  # diffs only against the previous entry, so its jobs can succeed with pytest skipped. No such run, a job that
  # did not succeed there (failed, skipped, cancelled, still running) or any API error leaves the list empty or
  # short and the job runs. The ARM64 jobs are not deduplicated; they run on free runners and are the post-merge
  # signal for that lane.
  # Assumptions: the jobs endpoint returns the latest attempt of a run (`filter=latest`, the default), and a
  # success in any merge-group run of the SHA counts.
  merge-queue-results:
    name: 'merge queue results'
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.always_run != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A failed lookup must not turn the push run red; the jobs then test as before.
    continue-on-error: true
    # Callers (release.yml) must grant `actions: read` too: a called workflow cannot elevate permissions.
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.names }}
    steps:
      - name: list the jobs that passed in the merge queue
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          lines=''
          if ! run_ids=$(gh api --paginate "repos/$REPO/actions/workflows/python-tests.yml/runs?head_sha=$SHA&event=merge_group&per_page=100" --jq '.workflow_runs[].id' | tr -d '\r'); then
            echo "could not list the merge-group runs; every job runs"
            run_ids=''
          fi
          for run_id in $run_ids; do
            if ! found=$(gh api --paginate "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success" and any(.steps[]?; .name == "run pytest" and .conclusion == "success")) | [.name, .html_url] | @tsv' | tr -d '\r'); then
              echo "could not list the jobs of merge-group run $run_id; its jobs run"
              continue
            fi
            while IFS=$'\t' read -r name url; do
              [ -n "$name" ] || continue
              echo "verified in https://github.com/$REPO/actions/runs/$run_id: $name ($url)"
              lines+="$name"$'\n'
            done <<< "$found"
          done
          names=$(printf '%s' "$lines" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique' | tr -d '\r') || names='[]'
          echo "names=${names:-[]}" >> "$GITHUB_OUTPUT"
        shell: bash

  matrix:
    needs: merge-queue-results
    # Runs when the job above was skipped (every event but a push to main) or failed, and tests as usual then.
    if: ${{ !cancelled() }}
    strategy:
      # Let the other platforms finish when one runner fails, so a rerun repeats only the failed job.
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
        platform:
          - linux-cpu
          - macos-default
          - windows-cpu
          - windows-ffmpeg
        include:
          - platform: linux-cpu
            os: blacksmith-4vcpu-ubuntu-2404
            extra-index-url: 'https://download.pytorch.org/whl/cpu'
            github-env: $GITHUB_ENV
            pytest-workers: logical
            timeout-minutes: 30
          - platform: macos-default
            os: blacksmith-6vcpu-macos-15
            github-env: $GITHUB_ENV
            pytest-workers: logical
            timeout-minutes: 30
          - platform: windows-cpu
            os: blacksmith-8vcpu-windows-2025
            github-env: $env:GITHUB_ENV
            pytest-workers: logical
            # This runner is Windows Server 2025 Core, which lacks the Video for Windows DLLs
            # (AVICAP32, MSVFW32) every standard Windows ffmpeg build links against, so ffmpeg
            # cannot start here. The `ffmpeg` tests run in windows-ffmpeg instead.
            # Windows installs linux's dependency set, so a `platform_independent` test cannot fail differently
            # here than on linux, which runs it. macOS runs a different torch without bitsandbytes and keeps them.
            pytest-markers: 'not slow and not platform_independent and not ffmpeg'
            prepare-server-core: true
            # Job takes 10-15 min (runner prep ~3.5, pytest startup ~2, tests ~5-8); 30 leaves linux's and macOS's room.
            timeout-minutes: 30
          - platform: windows-ffmpeg
            os: windows-2022
            github-env: $env:GITHUB_ENV
            # Half the vCPUs, not one worker each. The ffmpeg tests spawn decoders and encoders that
            # bring their own threads, which the per-worker `OMP_NUM_THREADS=1` below does not cap,
            # so a full-width run leaves this runner with no spare core and the deadline-sensitive
            # tests miss their budgets non-deterministically. Two workers keep that headroom.
            pytest-workers: '2'
            pytest-markers: 'not slow and not platform_independent and ffmpeg'
            # Roughly 1.5x the pytest step's two-worker wall time (~6 min), plus the job's ~1 min
            # of checkout and install, plus margin.
            timeout-minutes: 15
    name: 'py${{ matrix.python-version }}: ${{ matrix.platform }}'
    runs-on: ${{ matrix.os }}
    # Per platform: expected run time is 8-14 min on linux and macos. See the matrix for windows.
    timeout-minutes: ${{ matrix.timeout-minutes }}
    env:
      PIP_USE_PEP517: '1'
      # One compute thread per worker. Torch otherwise sizes its thread pools to the whole
      # machine, so one worker per vCPU puts vCPUs^2 threads on a runner that fight for the same
      # cores. This caps torch only; helper processes the tests spawn thread themselves.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      # 'true' when the merge queue already passed this job on this commit. Like a change that touches no Python
      # file, it leaves no step to run: change detection is skipped, so every gated step below skips too.
      MERGE_QUEUE_VERIFIED: "${{ inputs.always_run != true && contains(fromJSON(needs.merge-queue-results.outputs.verified || '[]'), format('py{0}: {1}', matrix.python-version, matrix.platform)) }}"

    steps:
      - name: checkout
        if: ${{ env.MERGE_QUEUE_VERIFIED != 'true' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: restore LFS cache
        if: ${{ env.MERGE_QUEUE_VERIFIED != 'true' }}
        uses: actions/cache@v5
        with:
          path: .git/lfs
          # Checkout leaves LFS pointer files, so their hash is the content key.
          key: lfs-${{ hashFiles('tests/test_model_probe/stripped_models/**', 'tests/model_identification/stripped_models/**') }}
          restore-keys: lfs-

      - name: pull LFS files
        if: ${{ env.MERGE_QUEUE_VERIFIED != 'true' }}
        run: git lfs pull
        shell: bash

      - name: skip, passed in the merge queue
        if: ${{ env.MERGE_QUEUE_VERIFIED == 'true' }}
        run: echo "This job passed on this commit in the merge queue; the 'merge queue results' job lists the run."
        shell: bash

      - name: check for changed python files
        if: ${{ inputs.always_run != true && env.MERGE_QUEUE_VERIFIED != 'true' }}
        id: changed-files
        # Pinned to the _hash_ for v45.0.9 to prevent supply-chain attacks.
        # See:
        # - CVE-2025-30066
        # - https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised
        # - https://github.com/tj-actions/changed-files/issues/2463
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          # `windows-arm64-changes` reuses this list through the anchor.
          files_yaml: &python-test-inputs |
            python:
              - 'pyproject.toml'
              # The lockfile pins pytest-xdist, which this workflow's pytest command depends on.
              - 'uv.lock'
              - '.github/workflows/python-tests.yml'
              - 'invokeai/**'
              - '!invokeai/frontend/webv1/**'
              - '!invokeai/frontend/webv2/**'
              # Re-includes must follow the exclusions above.
              # test_imports.py walks every package, including the frontend ones.
              - 'invokeai/frontend/webv1/**/*.py'
              - 'invokeai/frontend/webv2/**/*.py'
              # test_workflow_graph_builder.py validates these editor fixtures against the backend.
              - 'invokeai/frontend/webv2/src/features/workflow/core/fixtures/**'
              # Cross-stack generation contracts: the frontend writes these, Python validates them
              # against the invocation and architecture registries. A frontend-only change that
              # regenerates one would otherwise pass vitest while skipping the backend half.
              # Generation's `__fixtures__/` does not exist yet -- it arrives with the graph-builder
              # fixtures. A pattern matching nothing costs nothing here, and listing it now means the
              # branch that adds the directory does not also have to remember to add this line.
              - 'invokeai/frontend/webv2/src/features/generation/core/__snapshots__/**'
              - 'invokeai/frontend/webv2/src/features/generation/core/__fixtures__/**'
              # test_capabilities_fixture.py pins the served architecture table fixture to the backend.
              - 'invokeai/frontend/webv2/src/features/models/core/__fixtures__/**'
              - 'invokeai/frontend/webv2/src/features/video/core/__snapshots__/**'
              - 'invokeai/frontend/webv2/src/features/upscale/core/__snapshots__/**'
              # test_shared_numerical_fixtures.py checks the Python image adjustments against the
              # canvas spatial-adjustment kernels' shared fixtures.
              - 'invokeai/frontend/webv2/src/workbench/canvas-engine/render/spatial/__fixtures__/**'
              # test_ideogram4_frontend_bounds.py reads the Ideogram 4 control bounds from here.
              - 'invokeai/frontend/webv2/src/features/generation/core/settings.ts'
              - 'tests/**'
              # tests/ covers a few of these (e.g. test_check_pins.py, test_docs_json_export.py)
              - 'scripts/**'
              - 'pins.json'
              # test_check_pr_metadata.py parses the template as a body.
              - '.github/pull_request_template.md'

      - name: setup uv
        if: ${{ steps.changed-files.outputs.python_any_changed == 'true' || inputs.always_run == true }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'  # When updating this, make sure the version in launcher's package.json gets updated too.
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        if: ${{ steps.changed-files.outputs.python_any_changed == 'true' || inputs.always_run == true }}
        env:
          UV_INDEX: ${{ matrix.extra-index-url }}
        run: uv sync --no-progress --locked --extra test

      # Windows Server Core lacks two things the suite imports. The non-headless opencv build needs
      # Media Foundation at `import cv2`; the feature installs in ~30 s without a reboot. There is
      # no audio stack either, so `import sounddevice` raises PortAudioError, which mediapipe does
      # not catch (only ImportError/OSError). Removing the module turns that into the ImportError
      # mediapipe falls back on. No test needs a real audio device.
      - name: prepare server core
        if: ${{ matrix.prepare-server-core && (steps.changed-files.outputs.python_any_changed == 'true' || inputs.always_run == true) }}
        run: |
          $result = Install-WindowsFeature -Name Server-Media-Foundation
          Write-Output "Success: $($result.Success)  RestartNeeded: $($result.RestartNeeded)"
          $result.FeatureResult | Format-Table -AutoSize | Out-String | Write-Output
          if (-not $result.Success) { throw 'Installing Server-Media-Foundation failed' }
          Remove-Item .venv\Lib\site-packages\sounddevice.py
          uv run --no-sync python -c "import cv2, mediapipe; print(cv2.__version__, mediapipe.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'cv2 or mediapipe still fails to import after preparing the runner' }

      - name: run pytest
        if: ${{ steps.changed-files.outputs.python_any_changed == 'true' || inputs.always_run == true }}
        # `logical`, not `auto`: xdist's `auto` asks psutil for *physical* cores, which is half
        # the vCPUs a standard runner exposes. Much of the suite waits on timers and polls, so
        # one worker per vCPU is the right level where the runner has the headroom for it. The
        # matrix carries the count, because windows-ffmpeg needs a lower one.
        run: uv run --no-sync pytest -n ${{ matrix.pytest-workers }} --max-worker-restart=0 -m "${{ matrix.pytest-markers || 'not slow' }}"

  # Decides whether the ARM64 jobs run: always with `always_run`; otherwise for every change the matrix's Python
  # filter matches, on every event. ARM64 has failures of its own that no other platform shows, so no change that
  # the Python suite can see is ruled out by what it mentions.
  windows-arm64-changes:
    name: 'windows-arm64: change detection'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ inputs.always_run == true || steps.changed-files.outputs.python_any_changed == 'true' }}
    steps:
      - name: checkout
        if: ${{ inputs.always_run != true }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: check for changed python files
        if: ${{ inputs.always_run != true }}
        id: changed-files
        # Pinned to the _hash_ for v45.0.9, see the matrix job above.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files_yaml: *python-test-inputs

  # Windows on ARM64 (NVIDIA RTX Spark). The lockfile's ARM64 fork is exercised nowhere else:
  # torch 2.14.0+cu134 from NVIDIA's index (a 1.85 GB wheel, CPU-only on this runner), numpy 2,
  # onnxruntime 1.31, sentencepiece 0.2.2 and the self-built opencv/blake3/tiktoken wheels. uv
  # installs an x86_64 CPython on ARM64 Windows unless the request names the architecture.
  # The suite is split by test file across the shards (tests/sharding.py), balanced by the recorded
  # durations in tests/shard_durations.json.
  windows-arm64:
    needs: windows-arm64-changes
    if: ${{ needs.windows-arm64-changes.outputs.run == 'true' }}
    strategy:
      # Let the other shards finish when one fails, so a rerun repeats only the failed shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: 'py3.12: windows-arm64 ${{ matrix.shard }}/${{ strategy.job-total }}'
    runs-on: windows-11-arm
    # Setup (runner preparation, ffmpeg, dependency install) takes ~4 min. Shards are balanced by the recorded
    # per-file durations, and a file runs on one worker, so the longest file sets a floor for its shard. The
    # per-test timeout turns a hang into a failure inside this limit.
    timeout-minutes: 45
    env:
      PIP_USE_PEP517: '1'
      # One compute thread per worker, as in the matrix job.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: restore LFS cache
        uses: actions/cache@v5
        with:
          path: .git/lfs
          # Checkout leaves LFS pointer files, so their hash is the content key.
          key: lfs-${{ hashFiles('tests/test_model_probe/stripped_models/**', 'tests/model_identification/stripped_models/**') }}
          restore-keys: lfs-

      - name: pull LFS files
        run: git lfs pull
        shell: bash

      - name: setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'  # When updating this, make sure the version in launcher's package.json gets updated too.
          # The torch wheel unpacks to several GB of binaries; cached per lock hash it would crowd the
          # other lanes out of the repository's cache, and re-downloading it costs a couple of minutes.
          enable-cache: false
          python-version: cpython-3.12-windows-aarch64-none

      - name: prepare the ARM64 runner
        # The imageio-ffmpeg sdist bundles no ffmpeg binary; the video tests find one on PATH. Chocolatey's
        # package is an x64 build, which Windows on ARM runs under emulation.
        run: |
          uv run --no-project python -c "import platform, sys; assert platform.machine() == 'ARM64', platform.machine(); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'the runner or its Python is not ARM64' }
          choco install ffmpeg --version 9.0.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'installing ffmpeg failed' }
          ffmpeg -version | Select-Object -First 1

      - name: install dependencies
        run: uv sync --no-progress --locked --extra test

      - name: import the self-built and platform-specific wheels
        # The suite never imports tiktoken, so a broken self-built wheel would otherwise pass unnoticed.
        run: uv run --no-sync python -c "import blake3, cv2, onnxruntime, tiktoken, torch, torchvision; print(torch.__version__, torchvision.__version__, cv2.__version__, 'cuda available:', torch.cuda.is_available())"

      - name: run pytest
        # Two workers: the ffmpeg tests spawn decoders and encoders with threads of their own, which
        # `OMP_NUM_THREADS` does not cap. A per-test timeout turns a hang into a failure with a traceback,
        # so pytest still reaches its summary inside the job timeout.
        run: >-
          uv run --no-sync pytest -n 2 --max-worker-restart=0 -m "not slow" --timeout=600
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --shard-durations=tests/shard_durations.json
          --shard-record=${{ runner.temp }}/shard-durations-${{ matrix.shard }}.json

      # The recordings refresh tests/shard_durations.json (see the Windows ARM64 section of the testing guide).
      - name: upload the measured durations
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: shard-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          # One writer per name: a re-run of failed jobs uploads again.
          overwrite: true

  # The status for Windows ARM64, meant to be marked required by a maintainer; once it is, the merge queue blocks on
  # ARM64 for every change that runs the Python tests. A skipped job passes a required check, so this one always
  # runs and passes only when change detection succeeded and every shard succeeded, or was skipped because no
  # Python test runs.
  windows-arm64-tests:
    name: 'py3.12: windows-arm64'
    if: ${{ always() }}
    needs: [windows-arm64-changes, windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require every ARM64 shard
        env:
          CHANGES: ${{ needs.windows-arm64-changes.result }}
          RUN: ${{ needs.windows-arm64-changes.outputs.run }}
          RESULT: ${{ needs.windows-arm64.result }}
        run: |
          expected=skipped
          if [ "$RUN" = true ]; then expected=success; fi
          echo "change detection: $CHANGES, shards needed: ${RUN:-unknown}; shards: $RESULT"
          [ "$CHANGES" = success ] || exit 1
          [ "$RESULT" = "$expected" ] || exit 1
        shell: bash

  # Decides whether the external-database job runs. That job's service containers start before any of its
  # steps, so the decision has to come from a job of its own: otherwise every pull request, frontend-only ones
  # included, would pull both server images and wait for them to become healthy.
  external-database-changes:
    name: 'external database: change detection'
    needs: merge-queue-results
    # Skipped when the merge queue passed both server jobs on this commit (they are one matrix, so a job-level
    # `if` cannot take them one by one). The two names must match the `external-database` job name template;
    # a drift only makes the job run. A skipped or failed lookup job tests as usual.
    if: "${{ !cancelled() && !(contains(fromJSON(needs.merge-queue-results.outputs.verified || '[]'), 'py3.12: linux-mysql') && contains(fromJSON(needs.merge-queue-results.outputs.verified || '[]'), 'py3.12: linux-mariadb')) }}"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      run: ${{ steps.changed-files.outputs.python_any_changed == 'true' || inputs.always_run == true }}
    steps:
      - name: checkout
        if: ${{ inputs.always_run != true }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: restore LFS cache
        if: ${{ inputs.always_run != true }}
        uses: actions/cache@v5
        with:
          path: .git/lfs
          # Checkout leaves LFS pointer files, so their hash is the content key.
          key: lfs-${{ hashFiles('tests/test_model_probe/stripped_models/**', 'tests/model_identification/stripped_models/**') }}
          restore-keys: lfs-

      - name: pull LFS files
        if: ${{ inputs.always_run != true }}
        run: git lfs pull
        shell: bash

      - name: check for changed python files
        if: ${{ inputs.always_run != true }}
        id: changed-files
        # Pinned to the _hash_ for v45.0.9, see the matrix job above.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files_yaml: |
            python:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/python-tests.yml'
              - 'invokeai/**/*.py'
              # The library's tests store the bundled workflows and style presets.
              - 'invokeai/app/services/workflow_records/default_workflows/**'
              - 'invokeai/app/services/style_preset_records/default_style_presets.json'
              - 'tests/**'

  # The database layer against MySQL and MariaDB, at the oldest release of each that InvokeAI supports.
  # Only the tests on the database fixtures (marked `uses_database`) target the server; the matrix above
  # runs the whole suite, those tests included, on SQLite.
  external-database:
    needs: external-database-changes
    if: ${{ needs.external-database-changes.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: mysql
            image: 'mysql:8.4.11'
            health-cmd: 'mysqladmin ping -h 127.0.0.1 --silent'
            url: 'mysql+pymysql://root:invokeai@127.0.0.1:3306'
          - server: mariadb
            image: 'mariadb:10.11.19'
            health-cmd: 'mariadb-admin ping -h 127.0.0.1 --silent'
            url: 'mariadb+pymysql://root:invokeai@127.0.0.1:3306'
    name: 'py3.12: linux-${{ matrix.server }}'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: invokeai
          MARIADB_ROOT_PASSWORD: invokeai
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      INVOKEAI_TEST_DB_URL: ${{ matrix.url }}

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: restore LFS cache
        uses: actions/cache@v5
        with:
          path: .git/lfs
          # Checkout leaves LFS pointer files, so their hash is the content key.
          key: lfs-${{ hashFiles('tests/test_model_probe/stripped_models/**', 'tests/model_identification/stripped_models/**') }}
          restore-keys: lfs-

      - name: pull LFS files
        run: git lfs pull
        shell: bash

      - name: setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'  # When updating this, make sure the version in launcher's package.json gets updated too.
          enable-cache: true
          python-version: '3.12'

      - name: install dependencies
        env:
          UV_INDEX: 'https://download.pytorch.org/whl/cpu'
        run: uv sync --no-progress --locked --extra test --extra mysql

      - name: run pytest
        run: uv run --no-sync pytest -n logical --max-worker-restart=0 -m "uses_database and not sqlite_only and not slow"

      - name: server log
        if: ${{ failure() }}
        run: docker logs "${{ job.services.database.id }}"
