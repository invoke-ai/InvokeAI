name: 'docs'

on:
  # invoke.ai serves the v6 docs from this branch; main deploys v7 to v7.invoke.ai.
  push:
    branches:
      - 'v6-bugfixes'
  pull_request:
    types:
      - 'ready_for_review'
      - 'opened'
      - 'synchronize'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.manual.outputs.docs || steps.filter.outputs.docs }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Deploy-branch pushes always rebuild: with cancel-in-progress, a later push that skipped
      # the build would cancel an earlier docs push's deploy and leave its changes unpublished.
      - name: mark push or manual run
        if: github.event_name != 'pull_request'
        id: manual
        run: echo "docs=true" >> "$GITHUB_OUTPUT"

      - name: detect docs-related changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '.github/workflows/deploy-docs.yml'
              - 'docs/**'
              - 'scripts/generate_docs_json.py'
              - 'invokeai/app/**'
              - 'invokeai/backend/**'
              - 'pyproject.toml'
              - 'uv.lock'

  check-and-build:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        needs.changes.outputs.docs == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v6

      # Python (needed for generate-docs-data)
      - name: setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: '0.11.28'  # When updating this, make sure the version in launcher's package.json gets updated too.
          enable-cache: true
          python-version: '3.11'

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # generate_docs_json.py only needs the invokeai package importable
      # (pydantic + invokeai.app/backend). Skip the [test] extra to keep CI fast.
      - name: install python dependencies
        run: uv sync --frozen

      # Node (needed for docs build)
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: install docs dependencies
        run: pnpm install --prefer-frozen-lockfile
        working-directory: docs

      # Checks
      - name: verify generated docs data
        run: pnpm run check-docs-data
        working-directory: docs

      - name: build docs
        run: pnpm build
        working-directory: docs
        env:
          DEPLOY_TARGET: custom
          ENABLE_ANALYTICS: ${{ github.ref == 'refs/heads/v6-bugfixes' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: verify deploy output
        run: pnpm run check-deploy-output
        working-directory: docs
        env:
          DEPLOY_TARGET: custom

      # Upload artifact for deploy (v6-bugfixes branch only)
      - name: upload pages artifact
        if: github.ref == 'refs/heads/v6-bugfixes'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/v6-bugfixes'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
