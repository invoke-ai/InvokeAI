# Runs frontend code quality checks.
#
# Checks for changes to frontend files before running the checks.
# If always_run is true, always runs the checks.

name: 'frontend checks'

on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - 'ready_for_review'
      - 'opened'
      - 'synchronize'
  merge_group:
  workflow_dispatch:
    inputs:
      always_run:
        description: 'Always run the checks'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      always_run:
        description: 'Always run the checks'
        required: true
        type: boolean
        default: true

# One run per pull request: a new push cancels the superseded run. The PR number is used rather
# than the head branch, which two forks can share. Pushes to main and merge groups fall back to
# the run id and never cancel each other. The group names the workflow literally
# because `github.workflow` is the caller's name inside a reusable workflow, and release.yml calls
# several of these at once.
concurrency:
  group: frontend-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend-webv2-checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10 # expected run time: <2 min
    defaults:
      run:
        working-directory: invokeai/frontend/webv2
    steps:
      - uses: useblacksmith/checkout@v1

      - name: check for changed webv2 files
        if: ${{ inputs.always_run != true }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files_yaml: |
            webv2:
              - '.github/workflows/frontend-checks.yml'
              - '.nvmrc'
              - '.github/actions/install-frontend-deps/**'
              - 'invokeai/frontend/webv2/**'

      - name: install dependencies
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        uses: ./.github/actions/install-frontend-deps
        with:
          working-directory: invokeai/frontend/webv2

      - name: lint
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        run: 'pnpm run lint'
        shell: bash

      - name: build
        if: ${{ steps.changed-files.outputs.webv2_any_changed == 'true' || inputs.always_run == true }}
        run: 'pnpm run build'
        shell: bash
