name: build container image
on:
  push:
    branches:
      - 'main'
    paths:
      - 'pyproject.toml'
      - '.dockerignore'
      - 'invokeai/**'
      - 'docker/Dockerfile'
      - 'docker/docker-entrypoint.sh'
      - '.github/workflows/build-container.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      push-to-registry:
        description: Push the built image to the container registry
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  docker:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        gpu-driver:
        - cuda
        - cpu
        - rocm
    runs-on: ubuntu-latest
    name: ${{ matrix.gpu-driver }}
    env:
      # torch/arm64 does not support GPU currently, so arm64 builds
      # would not be GPU-accelerated.
      # re-enable arm64 if there is sufficient demand.
      # PLATFORMS: 'linux/amd64,linux/arm64'
      PLATFORMS: 'linux/amd64'
    steps:
      - name: Free up more disk space on the runner
        # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
        # the /mnt dir has 70GBs of free space
        # /dev/sda1        74G   28K   70G   1% /mnt
        # According to some online posts the /mnt is not always there, so checking before setting docker to use it
        run: |
          echo "----- Free space before cleanup"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          if [ -f /mnt/swapfile ]; then
            sudo swapoff /mnt/swapfile
            sudo rm -rf /mnt/swapfile
          fi
          if [ -d /mnt ]; then
            sudo chmod -R 777 /mnt
            echo '{"data-root": "/mnt/docker-root"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
          fi
          echo "----- Free space after cleanup"
          df -h

      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=sha,enable=true,prefix=sha-,format=short
          flavor: |
            latest=${{ matrix.gpu-driver == 'cuda' && github.ref == 'refs/heads/main' }}
            suffix=-${{ matrix.gpu-driver }},onlatest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container
        # The rocm image's venv layer is ~7.2GB compressed - roughly 60% larger than
        # cuda's and 9x cpu's - and BuildKit gzips a single layer on one thread, so
        # the export alone is ~6.5 min on a healthy runner. The whole job normally
        # lands at ~17 min, but every phase roughly doubles on a slow runner, which
        # blew through the old 40 min cap four times (2026-07-28, 2026-09-17 x2,
        # 2026-09-22).
        timeout-minutes: 90
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            GPU_DRIVER=${{ matrix.gpu-driver }}
          # `outputs` rather than `push` so we can set the compression level: BuildKit
          # defaults to gzip -6, which runs at ~19MB/s over that one big layer. gzip -1
          # is 2-3x faster for ~15% larger layers, which is a good trade when the
          # bottleneck is CI wall-clock rather than registry bandwidth. An empty
          # `outputs` emits no --output at all, which is what a non-pushing build did
          # before.
          #
          # The `== 'true'` is load-bearing. `github.event.inputs.*` is always a string,
          # and every non-empty string is truthy, so a bare reference to an unchecked
          # boolean input evaluates as TRUE. `push:` got away with it because the action
          # ran that input through core.getBooleanInput, which maps "false" to false;
          # `outputs:` is read with getInputList and passes any non-empty string straight
          # through to --output. Without the comparison, a manual run from a non-main
          # branch with the box unchecked would publish that branch to ghcr.
          outputs: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event.inputs.push-to-registry == 'true') && 'type=image,push=true,compression=gzip,compression-level=1' || '' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: |
          #   type=gha,scope=${{ github.ref_name }}-${{ matrix.gpu-driver }}
          #   type=gha,scope=main-${{ matrix.gpu-driver }}
          # cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.gpu-driver }}
